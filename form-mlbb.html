<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Isi Data Mobile Legends | EYA Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
<main id="konten">
    <div class="container py-4 py-lg-5">
      <div class="flow">
        <span id="mlbb-86" class="flow-anchor"></span>
        <span id="mlbb-172" class="flow-anchor"></span>
        <span id="mlbb-344" class="flow-anchor"></span>
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="katalog.html">Katalog</a></li>
            <li class="breadcrumb-item"><a href="detail-mlbb.html">Mobile Legends</a></li>
            <li class="breadcrumb-item active" aria-current="page">Isi data</li>
          </ol>
        </nav>
        <ol class="stepper" aria-label="Tahapan top up">
          <li class="is-done"><span class="dot"><i class="bi bi-check-lg" aria-hidden="true"></i></span><span class="lbl">Pilih paket</span></li>
          <li class="is-active" aria-current="step"><span class="dot">2</span><span class="lbl">Isi data</span></li>
          <li class=""><span class="dot">3</span><span class="lbl">Bayar</span></li>
          <li class=""><span class="dot">4</span><span class="lbl">Selesai</span></li>
        </ol>
        <div class="row g-4">
          <div class="col-lg-7 order-2 order-lg-1">
            <form class="form-card" id="form-topup" action="pembayaran.html" method="get">
              <input type="hidden" name="game" value="mlbb">
              <fieldset>
                <legend>Data akun game</legend>
                <div class="row g-3">
                      <div class="col-sm-7">
                        <label class="form-label" for="user_id">User ID</label>
                        <input class="form-control" type="text" id="user_id" name="user_id" placeholder="12345678"
                               inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="off" required>
                        <div class="form-text">Angka 6–12 digit</div>
                      </div>
                      <div class="col-sm-5">
                        <label class="form-label" for="zone_id">Zone ID</label>
                        <input class="form-control" type="text" id="zone_id" name="zone_id" placeholder="2345"
                               inputmode="numeric" pattern="[0-9]{3,5}" autocomplete="off" required>
                        <div class="form-text">Angka 3–5 digit</div>
                      </div>
                </div>
              </fieldset>
              <fieldset>
                <legend>Kontak untuk bukti pesanan</legend>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="wa">Nomor WhatsApp</label>
                    <input class="form-control" type="tel" id="wa" name="wa" placeholder="081234567890"
                           inputmode="tel" pattern="08[0-9]{8,12}" autocomplete="tel" required>
                    <div class="form-text">Diawali 08, contoh: 081234567890</div>
                  </div>
                </div>
              </fieldset>
</main>
</body>
</html>
