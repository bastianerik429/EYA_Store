<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak | EYA Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>

  <main id="konten">
    <div class="container page-head">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Beranda</a></li>
          <li class="breadcrumb-item active" aria-current="page">Kontak</li>
        </ol>
      </nav>
      <h1>Hubungi kami</h1>
      <p class="text-muted mb-0">Ada kendala dengan pesananmu? Ceritakan, kami bantu cek.</p>
    </div>

    <section class="section">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-7">
            <form class="form-card" action="mailto:halo@kiosgame.id" method="post" enctype="text/plain">
              <fieldset>
                <legend>Kirim pesan</legend>
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label" for="nama">Nama</label>
                    <input class="form-control" type="text" id="nama" name="nama" placeholder="Nama lengkap" minlength="3" autocomplete="name" required>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="topik">Topik</label>
                    <select class="form-select" id="topik" name="topik" required>
                      <option value="" selected disabled>Pilih topik</option>
                      <option>Item belum masuk</option>
                      <option>Salah memasukkan ID</option>
                      <option>Kendala pembayaran</option>
                      <option>Pertanyaan lainnya</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="pesan">Pesan</label>
                    <textarea class="form-control" id="pesan" name="pesan" rows="5" placeholder="Tulis pesanmu, sertakan nomor pesanan jika ada" minlength="10" required></textarea>
                  </div>
                </div>
              </fieldset>
              <button class="btn-kg" type="submit">Kirim pesan</button>
            </form>
          </div>

          <div class="col-lg-5">
            <div class="contact-list">
              <div class="feature">
                <span class="feature-icon is-mint"><i class="bi bi-whatsapp" aria-hidden="true"></i></span>
                <div><h2 class="h5">WhatsApp</h2><p>081348042302</p></div>
              </div>
              <div class="feature">
                <span class="feature-icon is-blue"><i class="bi bi-envelope-fill" aria-hidden="true"></i></span>
                <div><h2 class="h5">Email</h2><p>eyastore@gmail.com</p></div>
              </div>
              <div class="feature">
                <span class="feature-icon"><i class="bi bi-clock-fill" aria-hidden="true"></i></span>
                <div><h2 class="h5">Jam layanan</h2><p>Setiap hari, 08.00–22.00 WITA</p></div>
              </div>
              <div class="info-panel">
                <h2 class="h5">Cek dulu di sini</h2>
                <p class="mb-2">Jawaban untuk pertanyaan umum ada di halaman <a href="cara-topup.html#faq">Cara top up</a>.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
